name: Scrap Scanner

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: scrap-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache@v4
        with:
          path: state.json
          key: scrap-state-${{ github.run_id }}
          restore-keys: |
            scrap-state-

      - name: Consultar o mercado
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SCAN_MINUTES: '350'
        run: node scanner.js --loop
