name: Boss Alert

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Enviar alerta de teste imediato'
        required: false
        default: 'true'

concurrency:
  group: boss-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache@v4
        with:
          path: boss-state.json
          key: boss-state-${{ github.run_id }}
          restore-keys: |
            boss-state-

      - name: Monitorar Bosses em Tempo Real
        env:
          BOSS_WEBHOOK_URL: ${{ secrets.BOSS_WEBHOOK_URL || secrets.WEBHOOK_URL }}
          BOSS_ROLE_ID: ${{ secrets.BOSS_ROLE_ID || vars.BOSS_ROLE_ID || '' }}
          BOSSES: ${{ vars.BOSSES || 'Pumpkin Queen' }}
          SCAN_MINUTES: '350'
          IS_TEST: ${{ inputs.test }}
        run: |
          if [ "$IS_TEST" = "true" ]; then
            node boss.js --loop --test
          else
            node boss.js --loop
          fi
