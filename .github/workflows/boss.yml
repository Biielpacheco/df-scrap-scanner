name: Boss Alert

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: boss-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache@v4
        with:
          path: boss-state.json
          key: boss-state-${{ github.run_id }}
          restore-keys: |
            boss-state-

      - name: Monitorar Bosses em Tempo Real
        env:
          BOSS_WEBHOOK_URL: ${{ secrets.BOSS_WEBHOOK_URL || secrets.WEBHOOK_URL }}
          BOSSES: ${{ vars.BOSSES || 'Pumpkin Queen' }}
          SCAN_MINUTES: '350'
        run: node boss.js --loop
