name: Boss Alert

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: boss-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache@v4
        with:
          path: boss-state.json
          key: boss-state-${{ github.run_id }}
          restore-keys: |
            boss-state-

      - name: Procurar a Pumpkin Queen
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: node boss.js
